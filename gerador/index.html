/* Layout: work column (stage + export) beside a sticky control panel; stacks to one column on phones. */
:root {

  --panel: #faf7f4;
  --ink: #1d1c1a;

@media (prefers-color-scheme: dark) {

* { box-sizing: border-box; }
body {

  -webkit-font-smoothing: antialiased; margin: 0;

}
h1, h2, h3 { font-family: var(--display); font-weight: 500; letter-spacing: -0.03em; line-height: 1.05; margin: 0; text-wrap: balance; }

.export-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

  display: grid; gap: 2px; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--field); cursor: pointer; transition: border-color .2s, transform .3s var(--ease);

.progress { flex: 0 0 120px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; overscroll-behavior: contain; }
.sec { border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-size: 1.05rem; font-weight: 500; letter-spacing: -0.01em; }

.color-row .x:hover:not(:disabled) { border-color: var(--coral); color: var(--coral-ink); }
.color-row .x:disabled { opacity: .3; cursor: default; }

.size-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: end; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--field); }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }

<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const GIFENC_URL = new URL("../public/vendor/gifenc/gifenc.esm.js", location.href).href;
const KEY = "roim-gerador-formas-v1";
const $ = (s, r = document) => r.querySelector(s);
const V3 = THREE.Vector3;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- state (defaults = the live site) ---------------- */
const DEF = {
  count: 34, wCube: 2, wSphere: 2, wSlab: 1, sMin: 0.75, sMax: 1.5,
  colors: [
    { hex: "#ff5352", w: 2, fin: "satin" },
    { hex: "#f4edd8", w: 2, fin: "satin" },
    { hex: "#3b3935", w: 3, fin: "gloss" },
    { hex: "#e8dfc2", w: 1, fin: "matte" },
  ],
  seed: 7, spX: 9.5, spY: 4.6, spZ: 3, offX: 2.2, offY: 0, camZ: 26, fov: 32, float: 0.35,
  motion: !reduceMotion, interact: true,
  env: 0.55, light: 1.6, amb: 0.25, az: 37, el: 45, expo: 1,
  bg: "transparent", bgColor: "#232220",
  W: 1881, H: 594, scale: 2,
  tones: 3, embed: true, vidDur: 6, vidLoop: true, gifW: 800, gifFps: 20,
};
const FIN = {
  matte: { label: "Fosco", roughness: 0.6, metalness: 0, clearcoat: 0, ccr: 0.5 },
  satin: { label: "Acetinado", roughness: 0.42, metalness: 0, clearcoat: 0.4, ccr: 0.3 },
  gloss: { label: "Brilhante", roughness: 0.28, metalness: 0.15, clearcoat: 1, ccr: 0.12 },
  metal: { label: "Metálico", roughness: 0.25, metalness: 0.85, clearcoat: 0.5, ccr: 0.2 },
};
const clone = (o) => JSON.parse(JSON.stringify(o));
let S = (() => {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(clone(DEF), JSON.parse(raw)); } catch (e) {}
  return clone(DEF);
})();
let persistT;
const persist = () => { clearTimeout(persistT); persistT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 300); };

/* ---------------- ui helpers ---------------- */
const toastEl = $("#toast"); let toastT;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("on"), 2800); }
const statusText = $("#statusText"), prog = $("#prog");
function status(msg, p = null) { statusText.textContent = msg; prog.style.width = p == null ? "0%" : `${Math.round(p * 100)}%`; }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const frameYield = () => new Promise((r) => requestAnimationFrame(() => r()));

/* ---------------- downloads ---------------- */
async function saveFile(name, blob) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  status(`Salvo: ${name}`); toast(`Salvo: ${name}`);
}

/* ---------------- three.js scene (mirrors public/js/home.js) ---------------- */
const stage = $("#stage"), canvas = $("#cv"), stageMsg = $("#stageMsg");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true, powerPreference: "high-performance" });
} catch (e) {
  stageMsg.textContent = "Seu navegador não liberou WebGL, então a cena 3D não pode ser desenhada aqui.";
  throw e;
}
stageMsg.hidden = true;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.setClearColor(0x000000, 0);
const gl = renderer.getContext();
const MAX_DIM = Math.min(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), gl.getParameter(gl.MAX_VIEWPORT_DIMS)[0], 8192);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 300);
const keyLight = new THREE.DirectionalLight(0xffffff, 1.6); scene.add(keyLight);
const ambLight = new THREE.AmbientLight(0xffffff, 0.25); scene.add(ambLight);

const geos = {
  cube: new RoundedBoxGeometry(1.7, 1.7, 1.7, 4, 0.36),
  sphere: new THREE.SphereGeometry(0.95, 48, 32),
  slab: new RoundedBoxGeometry(2.6, 1.0, 1.0, 4, 0.36),
};
const SHAPES = ["cube", "sphere", "slab"];
const SHAPE_PT = { cube: "cubo", sphere: "esfera", slab: "barra" };
// rotation that maps each shape onto itself: lets video/GIF loop seamlessly
const SYM = { cube: Math.PI / 2, sphere: Math.PI * 2, slab: Math.PI };

let mats = [];
function syncMats() {
  S.colors.forEach((c, i) => {
    const f = FIN[c.fin] || FIN.satin;
    const m = mats[i] || (mats[i] = new THREE.MeshPhysicalMaterial());
    m.color.set(c.hex); m.roughness = f.roughness; m.metalness = f.metalness;
    m.clearcoat = f.clearcoat; m.clearcoatRoughness = f.ccr; m.envMapIntensity = S.env; m.needsUpdate = true;
  });
  mats.splice(S.colors.length).forEach((m) => m.dispose());
}

function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function pickW(r, ws) {
  const tot = ws.reduce((a, b) => a + Math.max(0, b), 0);
  if (tot <= 0) return Math.min(ws.length - 1, Math.floor(r * ws.length));
  let x = r * tot;
  for (let i = 0; i < ws.length; i++) { x -= Math.max(0, ws[i]); if (x < 0) return i; }
  return ws.length - 1;
}

let bodies = [];
function rebuild(entrance = false) {
  bodies.forEach((b) => scene.remove(b.mesh));
  bodies = [];
  syncMats();
  const rnd = mulberry32(S.seed >>> 0);
  const lo = Math.min(S.sMin, S.sMax), hi = Math.max(S.sMin, S.sMax);
  for (let i = 0; i < S.count; i++) {
    // a fixed number of draws per piece keeps the layout stable when only colors or mix change
    const R = Array.from({ length: 13 }, rnd);
    const shape = SHAPES[pickW(R[0], [S.wCube, S.wSphere, S.wSlab])];
    const ci = pickW(R[1], S.colors.map((c) => c.w));
    const s = lo + R[2] * (hi - lo);
    const mesh = new THREE.Mesh(geos[shape], mats[ci]);
    mesh.scale.setScalar(s);
    const home = new V3((R[3] * 2 - 1) * S.spX + S.offX, (R[4] * 2 - 1) * S.spY + S.offY, (R[5] * 2 - 1) * S.spZ);
    mesh.position.copy(home);
    if (entrance && S.motion) mesh.position.y -= 11 + R[9] * 5;
    mesh.rotation.set(R[6] * 6, R[7] * 6, R[8] * 6);
    scene.add(mesh);
    bodies.push({
      mesh, home, shape, ci, r: (shape === "slab" ? 1.25 : 1.0) * s,
      v: new V3(), w: new V3((R[10] - 0.5) * 0.01, (R[11] - 0.5) * 0.01, (R[12] - 0.5) * 0.01),
      phase: R[12] * Math.PI * 2, snap: null,
    });
  }
}

function syncLight() {

<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formas — João Roim</title>
<style>
  html, body { margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: #f3f0ea; padding: 24px; box-sizing: border-box; }
  .formas-roim { display: block; width: 100%; max-width: ${S.W}px; height: auto; }
</style>
</head>
<body>
  <img class="formas-roim" src="${src}" width="${S.W}" height="${S.H}" alt="Composição de formas 3D: cubos, esferas e barras">
</body>
</html>
`;
}
const exampleHtml = () => `<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exemplo — formas-roim</title>
<link rel="stylesheet" href="formas-roim.css">
<style>body{margin:0;padding:24px;background:#f3f0ea}</style></head>
<body><div class="formas-roim" role="img" aria-label="Composição de formas 3D"></div></body>
</html>
`;

/* ---------------- exporters ---------------- */
const EXPORTERS = {
  async png() {
    const { w, h } = outDims(); status("Renderizando PNG…", 0.3); await frameYield();
    const blob = await toBlob(rasterAt(w, h));
    await saveFile(`${baseName()}.png`, blob);
  },
  async svg() {
    status("Traçando vetores…", 0.3); await frameYield();
    await saveFile(`${baseName()}.svg`, new Blob([makeSVG(S.W, S.H)], { type: "image/svg+xml" }));
  },
  async eps() {
    status("Traçando vetores…", 0.3); await frameYield();
    await saveFile(`${baseName()}.eps`, new Blob([makeEPS(S.W, S.H)], { type: "application/postscript" }));
  },
  async html() {
    const { w, h } = outDims(); status("Renderizando imagem…", 0.3); await frameYield();
    const png = await toBlob(rasterAt(w, h));
    if (S.embed) await saveFile(`${baseName()}.html`, new Blob([htmlText(await blobToDataURL(png), w, h)], { type: "text/html" }));
    else await saveFile(`${baseName()}-html.zip`, await makeZip([{ name: "index.html", data: htmlText("formas-roim.png", w, h) }, { name: "formas-roim.png", data: png }]));
  },
  async css() {
    const { w, h } = outDims(); status("Renderizando imagem…", 0.3); await frameYield();
    const png = await toBlob(rasterAt(w, h));
    if (S.embed) { await saveFile(`${baseName()}.css`, new Blob([cssText(await blobToDataURL(png), w, h)], { type: "text/css" })); return; }
    await saveFile(`${baseName()}-css.zip`, await makeZip([{ name: "formas-roim.css", data: cssText("formas-roim.png", w, h) }, { name: "formas-roim.png", data: png }, { name: "exemplo.html", data: exampleHtml() }]));
  },
  async video() {
    if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) { status("Este navegador não grava vídeo. Use o GIF."); return; }
    let { w, h } = outDims();
    const k = Math.min(1, 1920 / Math.max(w, h));
    w = Math.max(2, Math.round((w * k) / 2) * 2); h = Math.max(2, Math.round((h * k) / 2) * 2);
    const alpha = S.bg === "transparent";
    const cands = alpha
      ? ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm", "video/mp4;codecs=avc1.640028", "video/mp4"]
      : ["video/mp4;codecs=avc1.640028", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
    const mime = cands.find((m) => MediaRecorder.isTypeSupported(m));
    if (!mime) { status("Nenhum formato de vídeo disponível neste navegador. Use o GIF."); return; }
    const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
    const comp = document.createElement("canvas"); comp.width = w; comp.height = h;
    const cx = comp.getContext("2d");
    const mr = new MediaRecorder(comp.captureStream(30), { mimeType: mime, videoBitsPerSecond: 16_000_000 });
    const chunks = []; mr.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    const done = new Promise((r) => (mr.onstop = r));
    useExportSize(w, h);
    if (S.vidLoop) snapshot();
    const paint = () => { cx.clearRect(0, 0, w, h); paintBg(cx, w, h); cx.drawImage(renderer.domElement, 0, 0, w, h); };
    paint();
    mr.start(250);
    rec = { t0: performance.now(), dur: S.vidDur, loop: S.vidLoop, paint, stop() { rec = null; mr.stop(); } };
    await done;
    if (S.vidLoop) restoreSnapshot();
    endExportSize();
    status("Preparando o arquivo de vídeo…", 1);
    await saveFile(`${baseName()}.${ext}`, new Blob(chunks, { type: mime.split(";")[0] }));
    if (alpha && ext === "mp4") toast("Este navegador grava só MP4, sem transparência. O fundo saiu preto.");
  },
  async gif() {
    status("Carregando o codificador de GIF…", 0.02);
    let enc;
    try { enc = await import(GIFENC_URL); } catch (e) { status("Não consegui carregar o codificador de GIF. Verifique a conexão e tente de novo."); return; }
    const { GIFEncoder, quantize, applyPalette } = enc;
    const gw = Math.min(S.gifW, S.W * S.scale), gh = Math.max(2, Math.round((gw * S.H) / S.W));
    const frames = Math.round(S.vidDur * S.gifFps), delay = Math.round(1000 / S.gifFps);
    const alpha = S.bg === "transparent";
    const comp = document.createElement("canvas"); comp.width = gw; comp.height = gh;
    const cx = comp.getContext("2d", { willReadFrequently: true });
    const gif = GIFEncoder();
    snapshot(); useExportSize(gw, gh);
    try {
      for (let i = 0; i < frames; i++) {
        loopPose(i / frames);
        renderer.render(scene, camera);
        cx.clearRect(0, 0, gw, gh); paintBg(cx, gw, gh); cx.drawImage(renderer.domElement, 0, 0, gw, gh);
        const data = cx.getImageData(0, 0, gw, gh).data;
        if (alpha) {
          const palette = quantize(data, 256, { format: "rgba4444", oneBitAlpha: true });
          const index = applyPalette(data, palette, "rgba4444");
          const ti = palette.findIndex((p) => p[3] === 0);
          gif.writeFrame(index, gw, gh, { palette, delay, transparent: ti >= 0, transparentIndex: Math.max(0, ti), dispose: 2 });
        } else {
          const palette = quantize(data, 256);
          gif.writeFrame(applyPalette(data, palette), gw, gh, { palette, delay });
        }
        status(`Montando GIF… quadro ${i + 1} de ${frames}`, (i + 1) / frames);
        if (i % 2 === 1) await sleep(0);
      }
      gif.finish();
    } finally { restoreSnapshot(); endExportSize(); }
    await saveFile(`${baseName()}.gif`, new Blob([gif.bytes()], { type: "image/gif" }));
  },
};

let exporting = false;
const xbtns = [...document.querySelectorAll("[data-export]")];
xbtns.forEach((btn) => btn.addEventListener("click", async () => {
  if (exporting) return;
  exporting = true; xbtns.forEach((b) => (b.disabled = true));
  try { await EXPORTERS[btn.dataset.export](); }
  catch (e) { console.error(e); status("Algo deu errado nessa exportação. Tente uma escala menor."); }
  finally { exporting = false; xbtns.forEach((b) => (b.disabled = false)); setTimeout(() => (prog.style.width = "0%"), 1200); }
}));

$("#btnCopyCss").addEventListener("click", async () => {
  let text;
  if (S.embed) { const { w, h } = outDims(); text = cssText(await blobToDataURL(await toBlob(rasterAt(w, h))), w, h); }
  else text = cssText("formas-roim.png");
  try { await navigator.clipboard.writeText(text); toast(S.embed ? "CSS copiado, com a imagem embutida." : "CSS copiado. Ele aponta para formas-roim.png."); }
  catch (e) { toast("Não foi possível copiar. Use o botão CSS para baixar o arquivo."); }
});

/* ---------------- control panel ---------------- */
const SECTIONS = [

    { sub: "Mix de formas (peso)" },
    { k: "wCube", label: "Cubos", min: 0, max: 10, step: 1, act: "rebuild" },
    { k: "wSphere", label: "Esferas", min: 0, max: 10, step: 1, act: "rebuild" },
    { k: "wSlab", label: "Barras", min: 0, max: 10, step: 1, act: "rebuild" },
    { sub: "Tamanho das peças" },
    { k: "sMin", label: "Escala mínima", min: 0.3, max: 2.5, step: 0.05, act: "rebuild" },
    { k: "sMax", label: "Escala máxima", min: 0.3, max: 2.5, step: 0.05, act: "rebuild" },
  ] },
  { id: "cores", title: "Cores", custom: "colors" },
  { id: "comp", title: "Composição", custom: "seed", items: [
    { k: "spX", label: "Espalhamento horizontal", min: 0, max: 24, step: 0.1, act: "rebuild" },
    { k: "spY", label: "Espalhamento vertical", min: 0, max: 14, step: 0.1, act: "rebuild" },
    { k: "spZ", label: "Profundidade", min: 0, max: 10, step: 0.1, act: "rebuild" },
    { k: "offX", label: "Deslocar na horizontal", min: -12, max: 12, step: 0.1, act: "rebuild" },
    { k: "offY", label: "Deslocar na vertical", min: -8, max: 8, step: 0.1, act: "rebuild" },
    { k: "camZ", label: "Distância da câmera", min: 8, max: 80, step: 0.5, act: "cam" },
    { k: "fov", label: "Lente (campo de visão)", min: 12, max: 75, step: 1, unit: "°", act: "cam" },
    { k: "float", label: "Flutuação", min: 0, max: 1.5, step: 0.05, act: "none" },
    { type: "check", k: "motion", label: "Movimento (desligue para congelar a pose)", act: "none" },
    { type: "check", k: "interact", label: "Mouse empurra as peças", act: "none" },
    { type: "buttons", buttons: [["btnFit", "Enquadrar tudo"], ["btnHome", "Voltar à posição inicial"]] },
  ] },
  { id: "luz", title: "Material e luz", items: [
    { k: "env", label: "Reflexo do ambiente", min: 0, max: 2, step: 0.05, act: "light" },
    { k: "light", label: "Luz principal", min: 0, max: 5, step: 0.05, act: "light" },
    { k: "amb", label: "Luz ambiente", min: 0, max: 1.5, step: 0.05, act: "light" },
    { k: "az", label: "Direção da luz", min: -180, max: 180, step: 1, unit: "°", act: "light" },
    { k: "el", label: "Altura da luz", min: -20, max: 90, step: 1, unit: "°", act: "light" },
    { k: "expo", label: "Exposição", min: 0.4, max: 2, step: 0.05, act: "light" },
    { hint: "O acabamento de cada cor (fosco, acetinado, brilhante, metálico) fica na seção Cores. A luz também define os tons do SVG e do EPS." },
  ] },
  { id: "saida", title: "Fundo e tamanho", custom: "size" },
  { id: "opts", title: "Opções de exportação", items: [
    { type: "select", k: "tones", label: "Tons no vetor", num: true, options: [[1, "1 · silhueta chapada"], [2, "2 tons"], [3, "3 tons"], [4, "4 tons"]], act: "none" },
    { type: "check", k: "embed", label: "Embutir a imagem no HTML e no CSS", act: "none" },
    { hint: "Desmarcado, o HTML e o CSS saem num .zip com o arquivo formas-roim.png ao lado e um exemplo de uso." },
    { k: "vidDur", label: "Duração do vídeo e do GIF", min: 2, max: 20, step: 1, unit: " s", act: "none" },
    { type: "check", k: "vidLoop", label: "Vídeo em loop perfeito", act: "none" },
    { hint: "Em loop, as peças flutuam e giram até voltar à pose inicial. Desmarcado, o vídeo grava a cena ao vivo e você pode empurrar as peças durante a gravação." },
    { type: "select", k: "gifW", label: "Largura do GIF", num: true, options: [[480, "480 px"], [800, "800 px"], [1080, "1080 px"], [1600, "1600 px"]], act: "none" },
    { type: "select", k: "gifFps", label: "Quadros por segundo do GIF", num: true, options: [[12, "12"], [15, "15"], [20, "20"], [25, "25"]], act: "none" },
    { hint: "Vídeo transparente sai em WebM no Chrome. GIF transparente tem borda serrilhada; com fundo de cor, fica limpo." },
  ] },
];

const panel = $("#panel");
const decimals = (step) => (String(step).split(".")[1] || "").length;
const fmtVal = (it, v) => Number(v).toFixed(decimals(it.step)) + (it.unit || "");

function ctlHTML(it) {
  if (it.sub) return `<p class="sub">${it.sub}</p>`;
  if (it.hint) return `<p class="hint">${it.hint}</p>`;
  if (it.type === "buttons") return `<div class="row">${it.buttons.map(([id, l]) => `<button class="btn btn-sm" type="button" id="${id}">${l}</button>`).join("")}</div>`;
  if (it.type === "check") return `<label class="check"><input type="checkbox" id="c-${it.k}" data-k="${it.k}"> ${it.label}</label>`;
  if (it.type === "select") return `<div class="ctl inline"><label for="c-${it.k}">${it.label}</label><select id="c-${it.k}" data-k="${it.k}">${it.options.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select></div>`;
  return `<div class="ctl"><label for="c-${it.k}">${it.label}</label><output id="o-${it.k}" for="c-${it.k}"></output><input type="range" id="c-${it.k}" data-k="${it.k}" min="${it.min}" max="${it.max}" step="${it.step}"></div>`;
}
const ITEMS = {};
function renderPanel() {
  panel.innerHTML = SECTIONS.map((sec) => {
    let body = "";
    if (sec.custom === "colors") body = `<div id="colorList" style="display:grid;gap:8px"></div><div class="row"><button class="btn btn-sm" type="button" id="btnAddColor">Adicionar cor</button></div><p class="hint">O peso define quantas peças recebem cada cor.</p>`;
    if (sec.custom === "seed") body = `<div class="ctl inline"><label for="c-seed">Variação (seed)</label><div class="row"><input class="field mono" style="width:96px" type="number" id="c-seed" min="0" max="999999" step="1"><button class="btn btn-sm" type="button" id="btnDice">Sortear</button></div></div>`;
    if (sec.custom === "size") body = `
      <div class="ctl inline"><label for="c-bg">Fundo</label><select id="c-bg"><option value="transparent">Transparente</option><option value="solid">Cor sólida</option><option value="site">Cartão do site (gradiente grafite)</option></select></div>
      <div class="ctl inline" id="bgColorRow"><label for="c-bgColor">Cor do fundo</label><input type="color" id="c-bgColor" style="width:56px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--field)"></div>
      <p class="sub">Tamanho da arte</p>
      <div class="size-grid">
        <label>Largura (px)<input class="field" type="number" id="c-W" min="64" max="8000" step="1" inputmode="numeric"></label>
        <button class="btn btn-sm" type="button" id="btnSwap" aria-label="Inverter largura e altura" title="Inverter">⇄</button>
        <label>Altura (px)<input class="field" type="number" id="c-H" min="64" max="8000" step="1" inputmode="numeric"></label>
      </div>
      <div class="ctl inline"><span style="font-size:.86rem">Escala</span><div class="seg" role="radiogroup" aria-label="Escala">${[1, 2, 4].map((s) => `<label><input type="radio" name="scale" value="${s}"><span>${s}x</span></label>`).join("")}</div></div>
      <p class="hint">A prévia segue a proporção escolhida. PNG, HTML e CSS saem em largura × altura × escala. SVG e EPS saem em largura × altura e podem ser ampliados sem perda.</p>`;
    body += (sec.items || []).map((it) => { if (it.k) ITEMS[it.k] = it; return ctlHTML(it); }).join("");
    return `<details class="sec" open><summary>${sec.title}</summary><div class="sec-body">${body}</div></details>`;
  }).join("") + `<div class="sec" style="padding:16px 18px"><p class="hint" style="margin:0">As configurações ficam guardadas neste navegador.</p></div>`;
  bindPanel();
}

function readUI() {
  Object.values(ITEMS).forEach((it) => {
    const el = $(`#c-${it.k}`); if (!el) return;
    if (it.type === "check") el.checked = !!S[it.k];
    else el.value = S[it.k];
    const o = $(`#o-${it.k}`); if (o) o.textContent = fmtVal(it, S[it.k]);
  });
  $("#c-seed").value = S.seed; $("#c-bg").value = S.bg; $("#c-bgColor").value = S.bgColor;
  $("#c-W").value = S.W; $("#c-H").value = S.H;
  document.querySelectorAll('input[name="scale"]').forEach((r) => (r.checked = +r.value === S.scale));
  renderColors();
}

function act(a) {
  if (a === "rebuild") rebuild();
  else if (a === "light") syncLight();
  else if (a === "cam") resize();
  persist();
}

function bindPanel() {
  Object.values(ITEMS).forEach((it) => {
    const el = $(`#c-${it.k}`); if (!el) return;
    const ev = it.type === "check" || it.type === "select" ? "change" : "input";
    el.addEventListener(ev, () => {
      S[it.k] = it.type === "check" ? el.checked : it.type === "select" ? (it.num ? +el.value : el.value) : +el.value;
      const o = $(`#o-${it.k}`); if (o) o.textContent = fmtVal(it, S[it.k]);
      act(it.act);
    });
  });
  $("#c-seed").addEventListener("change", (e) => { S.seed = Math.max(0, Math.floor(+e.target.value || 0)); rebuild(true); persist(); });
  $("#btnDice").addEventListener("click", newVariation);
  $("#btnFit").addEventListener("click", fitCamera);
  $("#btnHome").addEventListener("click", () => bodies.forEach((b) => { b.mesh.position.copy(b.home); b.v.set(0, 0, 0); }));
  $("#c-bg").addEventListener("change", (e) => { S.bg = e.target.value; syncBg(); persist(); });
  $("#c-bgColor").addEventListener("input", (e) => { S.bgColor = e.target.value; syncBg(); persist(); });
  const setSize = () => {
    S.W = Math.max(64, Math.min(8000, Math.round(+$("#c-W").value || DEF.W)));
    S.H = Math.max(64, Math.min(8000, Math.round(+$("#c-H").value || DEF.H)));
    $("#c-W").value = S.W; $("#c-H").value = S.H; syncSize(); persist();
  };
  $("#c-W").addEventListener("change", setSize); $("#c-H").addEventListener("change", setSize);
  $("#btnSwap").addEventListener("click", () => { [S.W, S.H] = [S.H, S.W]; $("#c-W").value = S.W; $("#c-H").value = S.H; syncSize(); persist(); });
  document.querySelectorAll('input[name="scale"]').forEach((r) => r.addEventListener("change", () => { S.scale = +r.value; syncSize(); persist(); }));
  $("#btnAddColor").addEventListener("click", () => {
    if (S.colors.length >= 8) { toast("Máximo de 8 cores."); return; }
    const extra = ["#f6b3a2", "#8d9a8f", "#c9a66b", "#6f7f99", "#ffffff", "#111111"];
    S.colors.push({ hex: extra[(S.colors.length - 4 + extra.length) % extra.length], w: 1, fin: "satin" });
    renderColors(); rebuild(); persist();
  });
}

function renderColors() {
  const box = $("#colorList");
  box.innerHTML = S.colors.map((c, i) => `
    <div class="color-row">
      <input type="color" id="col-${i}" value="${c.hex}" aria-label="Cor ${i + 1}">
      <div class="top"><span class="hex" id="hex-${i}">${c.hex}</span>
        <select id="fin-${i}" aria-label="Acabamento da cor ${i + 1}">${Object.entries(FIN).map(([k, f]) => `<option value="${k}"${k === c.fin ? " selected" : ""}>${f.label}</option>`).join("")}</select></div>
      <button class="x" type="button" id="rm-${i}" aria-label="Remover cor ${i + 1}"${S.colors.length <= 1 ? " disabled" : ""}>×</button>
      <div class="w"><input type="range" id="w-${i}" min="0" max="8" step="1" value="${c.w}" aria-label="Peso da cor ${i + 1}"><output id="wo-${i}">${c.w}</output></div>
    </div>`).join("");
  S.colors.forEach((c, i) => {
    $(`#col-${i}`).addEventListener("input", (e) => { c.hex = e.target.value; $(`#hex-${i}`).textContent = c.hex; syncMats(); persist(); });
    $(`#fin-${i}`).addEventListener("change", (e) => { c.fin = e.target.value; syncMats(); persist(); });
    $(`#w-${i}`).addEventListener("input", (e) => { c.w = +e.target.value; $(`#wo-${i}`).textContent = c.w; rebuild(); persist(); });
    $(`#rm-${i}`).addEventListener("click", () => { S.colors.splice(i, 1); renderColors(); rebuild(); persist(); });
  });
}

function syncSize() {
  stage.style.setProperty("--ar", S.W / S.H);
  $("#outSize").textContent = `Raster ${S.W * S.scale} × ${S.H * S.scale} px · vetor ${S.W} × ${S.H}`;
  requestAnimationFrame(resize);
}

function fitCamera() {
  const ar = S.W / S.H, t = Math.tan((S.fov * Math.PI) / 360);
  let need = 8;
  for (const b of bodies) {
    const ext = b.r * 1.15;
    const x = Math.abs(b.home.x) + ext, y = Math.abs(b.home.y) + ext + S.float;
    need = Math.max(need, y / t + b.home.z + ext, x / (t * ar) + b.home.z + ext);
  }
  S.camZ = Math.min(80, Math.round(need * 1.04 * 2) / 2);
  $("#c-camZ").value = S.camZ; $("#o-camZ").textContent = fmtVal(ITEMS.camZ, S.camZ);
  resize(); persist();
}
function newVariation() { S.seed = Math.floor(Math.random() * 999999); $("#c-seed").value = S.seed; rebuild(true); persist(); }

$("#btnShuffle").addEventListener("click", newVariation);
$("#btnReset").addEventListener("click", () => {
  S = clone(DEF); readUI(); syncBg(); syncSize(); syncLight(); rebuild(true); persist(); toast("Padrão do site restaurado.");
});

// installable app (PWA): offline cache + install prompt where the browser offers one
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
let installEvt = null;
addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; $("#btnInstall").hidden = false; });
$("#btnInstall").addEventListener("click", async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("#btnInstall").hidden = true; });
addEventListener("appinstalled", () => toast("Gerador instalado como app."));

renderPanel(); readUI(); syncBg(); syncSize(); syncLight(); resize(); rebuild(true);
frame();
</script>
</body>
